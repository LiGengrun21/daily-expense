name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DailyExpenseManager.sln

      - name: Format check
        run: dotnet format DailyExpenseManager.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DailyExpenseManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DailyExpenseManager.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build api blazor

      - name: Start application stack
        run: |
          docker compose up -d postgres api blazor

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs api
          exit 1

      - name: Check Blazor host
        run: |
          curl -fsS http://localhost:5173/ > /dev/null

      - name: Docker Compose status
        if: always()
        run: docker compose ps

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans
