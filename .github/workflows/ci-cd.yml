name: CI/CD

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to the short commit SHA.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  API_IMAGE_NAME: daily-expense-api
  BLAZOR_IMAGE_NAME: daily-expense-blazor
  ACR_NAME: ${{ vars.ACR_NAME || 'acrdailyexpensedev' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-daily-expense-dev' }}
  API_CONTAINER_APP_NAME: ${{ vars.API_CONTAINER_APP_NAME || 'ca-daily-expense-dev-api' }}
  BLAZOR_CONTAINER_APP_NAME: ${{ vars.BLAZOR_CONTAINER_APP_NAME || 'ca-daily-expense-dev-blazor' }}
  POSTGRES_SERVER_NAME: ${{ vars.POSTGRES_SERVER_NAME || 'pg-daily-expense-dev' }}

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DailyExpenseManager.sln

      - name: Format check
        run: dotnet format DailyExpenseManager.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DailyExpenseManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DailyExpenseManager.sln --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  docker-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker compose build api blazor

      - name: Start application stack
        run: |
          docker compose up -d postgres api blazor

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi

            sleep 2
          done

          docker compose logs api
          exit 1

      - name: Check Blazor host
        run: |
          curl -fsS http://localhost:5173/ > /dev/null

      - name: Docker Compose status
        if: always()
        run: docker compose ps

      - name: Docker Compose logs
        if: failure()
        run: docker compose logs

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy-azure:
    name: Build, push, and deploy Azure
    runs-on: ubuntu-latest
    environment: dev
    needs:
      - dotnet
      - docker-smoke
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            image_tag="${{ inputs.image_tag }}"
          else
            image_tag="${GITHUB_SHA::7}"
          fi

          acr_login_server="$(az acr show \
            --name "${ACR_NAME}" \
            --query loginServer \
            --output tsv)"

          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=${acr_login_server}" >> "$GITHUB_OUTPUT"

      - name: Docker login to ACR
        run: az acr login --name "${ACR_NAME}"

      - name: Build API image
        run: |
          docker build \
            --file src/DailyExpense.Api/Dockerfile \
            --tag "${{ steps.image.outputs.acr_login_server }}/${API_IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            --tag "${{ steps.image.outputs.acr_login_server }}/${API_IMAGE_NAME}:latest" \
            .

      - name: Build Blazor image
        run: |
          docker build \
            --file src/DailyExpense.Blazor/Dockerfile \
            --tag "${{ steps.image.outputs.acr_login_server }}/${BLAZOR_IMAGE_NAME}:${{ steps.image.outputs.tag }}" \
            --tag "${{ steps.image.outputs.acr_login_server }}/${BLAZOR_IMAGE_NAME}:latest" \
            .

      - name: Push API image
        run: |
          docker push "${{ steps.image.outputs.acr_login_server }}/${API_IMAGE_NAME}:${{ steps.image.outputs.tag }}"
          docker push "${{ steps.image.outputs.acr_login_server }}/${API_IMAGE_NAME}:latest"

      - name: Push Blazor image
        run: |
          docker push "${{ steps.image.outputs.acr_login_server }}/${BLAZOR_IMAGE_NAME}:${{ steps.image.outputs.tag }}"
          docker push "${{ steps.image.outputs.acr_login_server }}/${BLAZOR_IMAGE_NAME}:latest"

      - name: Setup .NET for EF Core migrations
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore projects for EF Core migrations
        run: dotnet restore DailyExpenseManager.sln

      - name: Enable Azure CLI dynamic extensions
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Get GitHub runner public IP
        id: runner_ip
        run: |
          runner_ip="$(curl -fsS https://api.ipify.org)"
          echo "ip=${runner_ip}" >> "$GITHUB_OUTPUT"

      - name: Allow GitHub runner to access PostgreSQL
        run: |
          az postgres flexible-server firewall-rule create \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --server-name "${POSTGRES_SERVER_NAME}" \
            --name "github-actions-${GITHUB_RUN_ID}" \
            --start-ip-address "${{ steps.runner_ip.outputs.ip }}" \
            --end-ip-address "${{ steps.runner_ip.outputs.ip }}"

      - name: Install EF Core tools
        run: dotnet tool install --tool-path ./.tools dotnet-ef --version 10.0.4

      - name: Run EF Core migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_POSTGRES_CONNECTION_STRING }}
        run: |
          ./.tools/dotnet-ef database update \
            --project src/DailyExpense.Infrastructure \
            --startup-project src/DailyExpense.Api

      - name: Remove GitHub runner PostgreSQL firewall rule
        if: always() && steps.runner_ip.outputs.ip != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --server-name "${POSTGRES_SERVER_NAME}" \
            --name "github-actions-${GITHUB_RUN_ID}" \
            --yes || true

      - name: Deploy API Container App
        run: |
          az containerapp update \
            --name "${API_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${{ steps.image.outputs.acr_login_server }}/${API_IMAGE_NAME}:${{ steps.image.outputs.tag }}"

      - name: Deploy Blazor Container App
        run: |
          az containerapp update \
            --name "${BLAZOR_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${{ steps.image.outputs.acr_login_server }}/${BLAZOR_IMAGE_NAME}:${{ steps.image.outputs.tag }}"

      - name: Resolve deployed URLs
        id: deployed
        shell: bash
        run: |
          api_fqdn="$(az containerapp show \
            --name "${API_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          blazor_fqdn="$(az containerapp show \
            --name "${BLAZOR_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          echo "api_url=https://${api_fqdn}" >> "$GITHUB_OUTPUT"
          echo "blazor_url=https://${blazor_fqdn}" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployed API
        run: |
          for i in {1..30}; do
            if curl -fsS "${{ steps.deployed.outputs.api_url }}/health"; then
              exit 0
            fi

            sleep 5
          done

          az containerapp logs show \
            --name "${API_CONTAINER_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --tail 100
          exit 1

      - name: Smoke test deployed Blazor
        run: |
          curl -fsS "${{ steps.deployed.outputs.blazor_url }}/" > /dev/null
          curl -fsS "${{ steps.deployed.outputs.blazor_url }}/appsettings.json"

      - name: Summary
        run: |
          echo "Published images:" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.image.outputs.acr_login_server }}/${API_IMAGE_NAME}:${{ steps.image.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.image.outputs.acr_login_server }}/${API_IMAGE_NAME}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.image.outputs.acr_login_server }}/${BLAZOR_IMAGE_NAME}:${{ steps.image.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${{ steps.image.outputs.acr_login_server }}/${BLAZOR_IMAGE_NAME}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed apps:" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ steps.deployed.outputs.api_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Blazor: ${{ steps.deployed.outputs.blazor_url }}" >> "$GITHUB_STEP_SUMMARY"
